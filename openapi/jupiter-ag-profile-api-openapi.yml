openapi: 3.2.0
info:
  title: Jupiter Prediction Market Profile API
  version: 1.0.0
  description: Jupiter Prediction Market API Schema
servers:
- url: https://api.jup.ag/prediction/v1
  description: Jupiter Prediction Market API Endpoint
security:
- ApiKeyAuth: []
tags:
- name: Profile
paths:
  /profiles/{ownerPubkey}:
    get:
      tags:
      - Profile
      summary: Get profile
      description: 'Trading statistics of a wallet: realised P&L, volume, prediction counts, active contracts and portfolio value. USD values are in micro USD.'
      parameters:
      - schema:
          type: string
        required: true
        description: Wallet public key.
        name: ownerPubkey
        in: path
      responses:
        '200':
          description: Profile stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  ownerPubkey:
                    type: string
                  realizedPnlUsd:
                    type: string
                  totalVolumeUsd:
                    type: string
                  predictionsCount:
                    type: string
                  correctPredictions:
                    type: string
                  wrongPredictions:
                    type: string
                  totalActiveContracts:
                    type: string
                    description: Legacy whole-contract count. Use totalActiveContractsMicro or totalActiveContractsDecimal for the exact value.
                  totalActiveContractsMicro:
                    type: string
                    description: Active contracts in micro-contract units (1000000 = 1 contract)
                  totalActiveContractsDecimal:
                    type: string
                    description: Active contracts as a decimal string
                  totalPositionsValueUsd:
                    type: string
                required:
                - ownerPubkey
                - realizedPnlUsd
                - totalVolumeUsd
                - predictionsCount
                - correctPredictions
                - wrongPredictions
                - totalActiveContracts
                - totalPositionsValueUsd
        '404':
          description: Profile not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
      operationId: getProfilesByOwnerPubkey
      x-operation-id-source: derived
  /profiles/{ownerPubkey}/pnl-history:
    get:
      tags:
      - Profile
      summary: Get P&L history
      description: 'Profit and loss time series of a wallet for charting: `count` points spaced by `interval`.'
      parameters:
      - schema:
          type: string
        required: true
        description: Wallet public key.
        name: ownerPubkey
        in: path
      - schema:
          type: string
          enum:
          - 24h
          - 1w
          - 1m
          default: 1w
        required: false
        description: 'Spacing between points: `24h`, `1w` or `1m`.'
        name: interval
        in: query
      - schema:
          type: integer
          maximum: 1000
          default: 10
          exclusiveMinimum: 0
        required: false
        description: Number of points to return.
        name: count
        in: query
      responses:
        '200':
          description: PnL history for charting
          content:
            application/json:
              schema:
                type: object
                properties:
                  ownerPubkey:
                    type: string
                  history:
                    type: array
                    items:
                      type: object
                      properties:
                        timestamp:
                          type: integer
                        realizedPnlUsd:
                          type: string
                      required:
                      - timestamp
                      - realizedPnlUsd
                required:
                - ownerPubkey
                - history
      operationId: getProfilesByOwnerPubkeyPnlHistory
      x-operation-id-source: derived
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: Get API key via https://developers.jup.ag/portal
