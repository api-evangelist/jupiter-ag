  name: Jupiter Swap API
  description: >-
    Returns the best swap route across Solana DEX liquidity and produces a versioned transaction ready
    to sign and send. Supports quote-then-swap, swap-instructions for custom transaction building, slippage
    models, dynamic compute units, and priority fee guidance.
  humanURL: https://dev.jup.ag/docs/swap-api
  baseURL: https://api.jup.ag/swap
  tags:
